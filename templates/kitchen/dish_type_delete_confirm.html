{% extends "base.html" %}

{% block content %}
  <div class="card shadow-sm p-4 text-center">
    <h2 class="mb-3 text-danger">Delete Dish Type</h2>
    <p>Are you sure you want to delete <strong>{{ dish_type.name }}</strong>?</p>

    <form method="post" class="d-flex justify-content-center mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger me-2">Yes, delete</button>
      <a href="{% url 'kitchen:dish-type-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
{% endblock %}
