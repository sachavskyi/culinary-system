{% extends "base.html" %}

{% block content %}
	<h1> Cook list</h1>
  {% if cook_list %}
    <ul>
      {% for cook in cook_list %}
        <li>
          <a href="{% url "kitchen:cook-detail" cook.pk %}">{{ cook.username }}</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    Don't have cooks
  {% endif %}
{% endblock %}
