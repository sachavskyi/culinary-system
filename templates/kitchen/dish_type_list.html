{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold">Dish Types</h1>
    <a href="{% url 'kitchen:dish-type-create' %}" class="btn btn-success">
      <i class="bi bi-plus-circle"></i> Create Dish Type
    </a>
  </div>

  <form method="get" class="input-group mb-4 w-50">
    <input
      type="text"
      name="search"
      class="form-control"
      placeholder="Search by name"
      value="{{ request.GET.search }}">
    <button class="btn btn-outline-success" type="submit">
      <i class="bi bi-search"></i> Search
    </button>
  </form>

  {% if dish_type_list %}
    <div class="table-responsive">
      <table class="table table-hover align-middle shadow-sm">
        <thead class="table-success">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col" class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for dish_type in dish_type_list %}
            <tr>
              <td>{{ dish_type.id }}</td>
              <td>{{ dish_type.name }}</td>
              <td class="text-center">
                <a href="{% url 'kitchen:dish-type-update' dish_type.id %}" class="btn btn-sm btn-outline-primary me-2">
                  <i class="bi bi-pencil"></i> Update
                </a>
                <a href="{% url 'kitchen:dish-type-delete' dish_type.id %}" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash"></i> Delete
                </a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <div class="alert alert-warning text-center">
      No dish types found.
    </div>
  {% endif %}
{% endblock %}
