{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="d-flex flex-column justify-content-center align-items-center min-vh-50">
    <div class="card shadow-sm p-5" style="max-width: 400px; width: 100%;">
      <h2 class="mb-4 text-primary text-center">👋 Login</h2>

      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit" class="btn btn-success w-100 mt-3">
          <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
      </form>

      <p class="text-center mt-3 text-muted">
        Don't have an account? <a href="{% url 'login' %}">Sign up</a>
      </p>
    </div>
  </div>
{% endblock %}
